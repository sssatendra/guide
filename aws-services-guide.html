    title:"S3 — Object Storage Fundamentals",
    def:"Amazon S3 (Simple Storage Service) is a highly available, durable object storage service. Objects are stored in buckets with unique keys, accessible via HTTP/HTTPS. Built on 11 nines of durability.",

      {title:"Creating & Using S3 Buckets",code:`import boto3

# Initialize S3 client
s3 = boto3.client('s3')

# Create bucket
s3.create_bucket(
    Bucket='my-data-bucket',
    CreateBucketConfiguration={'LocationConstraint': 'us-east-1'}
)

# Upload object
s3.put_object(
    Bucket='my-data-bucket',
    Key='data/users.csv',
    Body=open('users.csv', 'rb').read()
)

# Download object
response = s3.get_object(Bucket='my-data-bucket', Key='data/users.csv')
data = response['Body'].read()

# List objects
response = s3.list_objects_v2(Bucket='my-data-bucket', Prefix='data/')
for obj in response['Contents']:

s3 = boto3.resource('s3')

# Access bucket
bucket = s3.Bucket('my-data-bucket')

# Upload file

# Download file

# Delete object

      {title:"Lifecycle & Storage Classes",code:`import boto3

s3 = boto3.client('s3')

# Define lifecycle policy
lifecycle_policy = {
    'Rules': [
        {
            'Id': 'archive-old-logs',
            'Status': 'Enabled',
            'Prefix': 'logs/',
            'Transitions': [
                {
                    'Days': 30,
                    'StorageClass': 'STANDARD_IA'  # After 30 days

                {
                    'Days': 90,
                    'StorageClass': 'GLACIER'  # After 90 days
                }

            'Expiration': {

        }
    ]
}

s3.put_bucket_lifecycle_configuration(

      {title:"Multipart Upload & Encryption",code:`import boto3

s3 = boto3.client('s3')

# Enable versioning
s3.put_bucket_versioning(
    Bucket='my-data-bucket',
    VersioningConfiguration={'Status': 'Enabled'}
)

# Multipart upload (for large files)
response = s3.create_multipart_upload(
    Bucket='my-data-bucket',
    Key='large-dataset.zip',
    ServerSideEncryption='AES256'  # Encryption
)
upload_id = response['UploadId']

# Upload parts
parts = []
with open('large-file.zip', 'rb') as f:
    part_num = 1
    for chunk in iter(lambda: f.read(5*1024*1024), b''):
        part = s3.upload_part(
            Bucket='my-data-bucket',
            Key='large-dataset.zip',
            PartNumber=part_num,
            UploadId=upload_id,
            Body=chunk
        )
        parts.append({'ETag': part['ETag'], 'PartNumber': part_num})
        part_num += 1

# Complete upload
s3.complete_multipart_upload(
    Bucket='my-data-bucket',
    Key='large-dataset.zip',
    UploadId=upload_id,
    MultipartUpload={'Parts': parts}
)`}
    ],

      {title:"Creating Users & Policies",code:`import boto3

iam = boto3.client('iam')

print(f"Access Key: {key['AccessKey']['AccessKeyId']}")

import json

iam = boto3.client('iam')
sts = boto3.client('sts')

# Create role for Lambda
assume_policy = {
    "Version": "2012-10-17",
    "Statement": [
        {
            "Effect": "Allow",
            "Principal": {"Service": "lambda.amazonaws.com"},
            "Action": "sts:AssumeRole"

iam.attach_role_policy(

credentials = assumed['Credentials']
print(f"AccessKeyId: {credentials['AccessKeyId']}")
print(f"SecretAccessKey: {credentials['SecretAccessKey']}")
print(f"SessionToken: {credentials['SessionToken']}")`}
    ],
    explanation:"Users are for people (developers, analysts). Roles are for services (Lambda, EC2). Policies are JSON documents that specify permissions. Always use least-privilege principle: grant minimum permissions needed.",

{

def lambda_handler(event, context):

      {title:"Serverless ETL Pipeline",code:`import json
import boto3
import logging
import psycopg2

s3 = boto3.client('s3')
sns = boto3.client('sns')
logger = logging.getLogger()
logger.setLevel('INFO')

def lambda_handler(event, context):
    """S3 trigger: validate, transform, load to Aurora"""
    
    try:
        # Extract S3 object info
        bucket = event['Records'][0]['s3']['bucket']['name']
        key = event['Records'][0]['s3']['object']['key']
        
        logger.info(f"Processing s3://{bucket}/{key}")
        
        # Download & validate
        obj = s3.get_object(Bucket=bucket, Key=key)
        data = obj['Body'].read().decode('utf-8')
        
        records = json.loads(data)
        if not isinstance(records, list):
            raise ValueError("Invalid format: expected JSON array")
        
        logger.info(f"Validated {len(records)} records")
        
        # Transform
        transformed = []
        for rec in records:
            rec['processed_at'] = datetime.now().isoformat()
            rec['source'] = key
            transformed.append(rec)
        
        # Load to Aurora
        conn = psycopg2.connect(
            host=os.environ['DB_HOST'],
            user=os.environ['DB_USER'],
            password=os.environ['DB_PASS'],
            database=os.environ['DB_NAME']
        )
        
        cur = conn.cursor()
        for rec in transformed:
            cur.execute("""
                INSERT INTO events(user_id, event_type, data)
                VALUES(%s, %s, %s)
            """, (rec['user_id'], rec['type'], json.dumps(rec)))
        
        conn.commit()
        cur.close()
        conn.close()
        
        # Notify success
        sns.publish(
            TopicArn=os.environ['SNS_TOPIC'],
            Subject='Pipeline Success',
            Message=f'Processed {len(transformed)} records from {key}'
        )
        
        return {'statusCode': 200, 'body': 'Success'}
        
    except Exception as e:
        logger.error(f"Error: {str(e)}")
        sns.publish(
            TopicArn=os.environ['SNS_TOPIC'],
            Subject='Pipeline Failed',
            Message=f'Error processing {key}: {str(e)}'
        )
        raise`},

function showQ(id) {
  const question = content[id];
  if (!question) return;

  let html = `<div style="animation:fadeIn 0.3s;"><div class="qhead">
    <span class="qnum">${id.toString().padStart(2,'0')}</span>
    <div><div class="qtitle">${question.title}</div>`;

  html += `<div class="badges">`;
  (question.badges || []).forEach(badge => {
    html += `<span class="fbadge" style="border-color:#ff9900;color:#ff9900;">${badge}</span>`;
  });
  html += `</div></div></div>`;

  html += `<div class="def-section"><strong>Definition:</strong> ${question.def}</div>`;

  if (question.examples) {
    question.examples.forEach((example, i) => {
      html += `<div><div class="slabel">Example ${i+1}: ${example.title}</div>
        <div class="code-block"><code>${escapeHtml(example.code)}</code></div></div>`;
    });
  }

  if (question.explanation) {
    html += `<div class="expl-box"><strong>Explanation:</strong> ${question.explanation}</div>`;
  }

  if (question.inputOutput) {
    html += `<div class="io-grid">
      <div class="io-box"><h5>Input</h5><code>${escapeHtml(question.inputOutput.input)}</code></div>
      <div class="io-box"><h5>Output</h5><code>${escapeHtml(question.inputOutput.output)}</code></div>
    </div>`;
  }

  if (question.realWorld) {
    html += `<div class="realworld-box"><strong>🌍 Real-World Application:</strong> ${question.realWorld}</div>`;
  }

  html += `<div class="navrow">
    <button class="nbtn ${id===1?'off':''}" onclick="showQ(${id-1})">← Prev</button>
    <button class="nbtn ${id===Object.keys(content).length?'off':''}" onclick="showQ(${id+1})">Next →</button>
  </div></div>`;

  document.getElementById('content').innerHTML = html;
  updateActiveItem(id);
  window.scrollTo(0,0);
}

function updateActiveItem(id) {
  document.querySelectorAll('.qi').forEach(el=>el.classList.remove('active'));
  document.getElementById(`si-${id}`)?.classList.add('active');
}

function renderTopics() {
  let desktop='',mobile='';
  topics.forEach(topic => {
    const categoryColor = {storage:'#3b82f6',security:'#f472b6',compute:'#10b981',container:'#06b6d4',database:'#f59e0b'}[topic.cat]||'#6b7280';
    const item = `<div class="qi" id="si-${topic.id}" onclick="showQ(${topic.id})">
      <span class="qn">${topic.id.toString().padStart(2,'0')}</span>
      <span class="qt">${topic.title}</span>
      <span class="fdot" style="background:${categoryColor}"></span>
    </div>`;
    desktop+=item;
    mobile+=item;
  });
  document.getElementById('deskqlist').innerHTML=desktop;
  document.getElementById('moblist').innerHTML=mobile;
  showQ(1);
}

function toggleMobOverlay() {
  document.getElementById('moboverlay').classList.toggle('open');
}

function toggleFilter(cat) {
  const btns=document.querySelectorAll('.fbtn');
  btns.forEach(btn=>btn.classList.remove('on'));
  event.target.classList.add('on');
  const items=document.querySelectorAll('.qi');
  items.forEach(item => {
    const id=parseInt(item.id.substring(3));
    const topic=topics.find(t=>t.id===id);
    item.classList.toggle('hidden',cat!=='all'&&topic.cat!==cat);
  });
}

function filterQuestions() {
  const search=(document.getElementById('searchbox-mob')?.value||document.getElementById('searchbox')?.value||'').toLowerCase();
  document.querySelectorAll('.qi').forEach(item => {
    const text=item.querySelector('.qt').textContent.toLowerCase();
    item.classList.toggle('hidden',!text.includes(search));
  });
}

function escapeHtml(text) {
  const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return text.replace(/[&<>"']/g,m=>map[m]);
}

document.addEventListener('DOMContentLoaded',renderTopics);
document.getElementById('searchbox')?.addEventListener('keyup',filterQuestions);
</script>
